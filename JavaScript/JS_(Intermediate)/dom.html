<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>
    <!-- // Learn difference between innerText & textContent & innerHTML

    // innerText: This gives the visible text in an element
    // textContent: This gives all the text in the element (visible or hidden)
    // innerHTML: This returns the inner text but if it has another tag inside it, this would give that tag's HTML as
    text.

    // Node List

    /*

    // Simple for, while, doWhile loops work with nodeList, the array methods don't

    document.querySelectorAll('div').forEach((d) => {
    d.innerText = 'Hello';
    d.style.color = 'red';
    });
    // But forEach doesn't work if we have selected using document.getElementByClassName('classNamee')

    // OR

    // 1. Select your elements (returns a NodeList)
    const nodeList = document.querySelectorAll('div');
    // Converted to an array, so we can use the features / methods of an array on the node lists

    // 2. Convert to an array
    const array = [...nodeList];


    // or

    const nodeList = document.getElementByClassName('list-el');
    const listConvertedArray = Array.from(nodelist);
    // Now, all the array methods would work on => listConvertedArray

    */ -->

    <h1>Hi there.</h1>
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
        <div class="day">Friday</div>
        <div class="day">Saturday</div>
        <div class="day">Sunday</div>
    </div>
</body>
<script>
    const parentDiv = document.querySelector('.parent');
    const days = document.querySelectorAll('.day');

    console.log(parentDiv);
    console.log(days);
    console.log(days[0]);
    console.log(days[0].innerHTML);

    days.forEach((day) => console.log(day.innerHTML));

    for (let i = 0; i < days.length; i++) {
        console.log(i + 1, days[i].innerHTML);
    }

    console.log(parentDiv.firstElementChild.innerHTML);
    console.log(parentDiv.lastElementChild.innerHTML);

    const day1 = days[1];

    console.log(day1.parentElement.innerText);
    console.log(day1.nextElementSibling.innerHTML);
    console.log(day1.previousElementSibling.innerHTML);
</script>

</html>
