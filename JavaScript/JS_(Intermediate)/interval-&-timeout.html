<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Hussain Durrani is Great</h1>
    <button id="stop">Stop</button>
    <br />
    <button id="start">Start</button>
    <button id="stop2">Stop 2</button>
  </body>
  <script>
    const stop = document.querySelector("#stop");

    const changeH1 = function () {
      document.querySelector("h1").innerHTML = "Hussain is Great";
      console.log("I have changed it...");
    };

    let ToutRef = setTimeout(changeH1, 2000);

    stop.addEventListener("click", function () {
      clearTimeout(ToutRef);
      console.log("Stopped!");
      stop.disabled = true;
    });

    const stop2 = document.querySelector("#stop2");
    const start = document.querySelector("#start");

    let intervalID = null;

    const sayDate = (str) => {
      console.log(str, Date.now());
    };

    start.addEventListener("click", function () {
      if (!intervalID) {
        intervalID = setInterval(sayDate, 2000, "Helloo ->");
      }
    });
    stop2.addEventListener("click", function () {
      clearInterval(intervalID);
      intervalID = null;
    });
  </script>
</html>
